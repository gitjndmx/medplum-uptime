name: uptime
# Every 5 minutes, from outside the clinic's server. GitHub's own schedule for this repository did not
# start (4 Oct 2026), so a run checks every 5 minutes for just under six hours (a run's limit) and then
# starts the next run itself. The schedule stays as a backstop: a single check, and it restarts the chain
# when no run is going (5 Oct 2026: GitHub could not start a run for twenty minutes, the run that would
# have started the next never ran, and the chain stopped until restarted by hand). If the chain
# ever breaks, Oracle's "the outside checker has stopped" alarm fires within 20 minutes, and the clinic's
# nightly audit sees it too.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: uptime-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      OCI_USER: ${{ secrets.OCI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: one check (the schedule)
        if: github.event_name == 'schedule'
        run: python check.py
      - name: restart the chain if it has stopped (the schedule)
        if: github.event_name == 'schedule'
        run: |
          going=$(gh run list -R "$GITHUB_REPOSITORY" -w uptime.yml -e workflow_dispatch -L 10 --json status \
            -q '[.[] | select(.status != "completed")] | length')
          if [ "$going" = "0" ]; then echo "no run going - starting the chain"; gh workflow run uptime.yml -R "$GITHUB_REPOSITORY" --ref main; else echo "the chain is running"; fi
      - name: every 5 minutes for 5 h 40 min, then the next run
        if: github.event_name != 'schedule'
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python check.py || echo "this round failed - the alarm decides, not the loop"
            sleep 300
          done
          gh workflow run uptime.yml -R "$GITHUB_REPOSITORY" --ref main
      # GitHub stops a repository's workflows after 60 days with no commits: one a month keeps them.
      - name: keep the workflows alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 25*86400 )) ]; then
            git config user.name "medplum-uptime"; git config user.email "uptime@medplum.site"
            date -u > .keepalive && git add .keepalive && git commit -qm "keep the uptime workflows alive" && git push -q
          fi
